<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/material-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <script type="module" src="js/popup.js"></script>
</head>

<body>
    <div class="header">
        <h1>
            <span class="material-icons">trending_up</span>
            <span data-i18n="header_title"></span>
        </h1>
        <div class="header-actions">
            <button class="search-button" id="search-btn" title="Ara">
                <span class="material-icons">search</span>
            </button>
            <button class="settings-button" id="settings-btn" title="Ayarlar">
                <span class="material-icons">settings</span>
            </button>
            <button class="refresh-button" id="refresh-btn" title="Yenile">
                <span class="material-icons">refresh</span>
            </button>
        </div>
    </div>
    <div class="main-tabs">
        <button class="main-tab-btn active" data-tab="gundem">
            <span class="material-icons">local_fire_department</span>
            <span data-i18n="tab_gundem"></span>
        </button>
        <button class="main-tab-btn" data-tab="debe">
            <span class="material-icons">emoji_events</span>
            <span data-i18n="tab_debe"></span>
        </button>
    </div>
    <div id="search-panel" class="search-panel hidden">
        <h2>Ara</h2>
        <div class="search-input-wrapper">
            <span class="material-icons search-icon">search</span>
            <input type="text" id="search-input" placeholder="Başlık veya yazar ara..." autocomplete="off">
            <span class="material-icons search-clear">close</span>
            <div class="search-loading"></div>
        </div>
        <div id="search-results-container"></div>
    </div>
    <div class="content">
        <div id="settings-panel" class="settings-panel hidden">
            <h2 data-i18n="settings_title"></h2>
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="general" data-i18n="tab_general"></button>
                <button class="tab-btn" data-tab="favorites" data-i18n="tab_favorites"></button>
            </div>
            
            <div class="tab-content active" data-tab="general">
                <div class="settings-group">
                    <label data-i18n="theme_label"></label>
                    <div class="theme-selector">
                        <label class="theme-option">
                            <input type="radio" name="theme" value="auto">
                            <span class="material-icons">brightness_auto</span>
                            <span data-i18n="theme_auto"></span>
                        </label>
                        <label class="theme-option">
                            <input type="radio" name="theme" value="light">
                            <span class="material-icons">light_mode</span>
                            <span data-i18n="theme_light"></span>
                        </label>
                        <label class="theme-option">
                            <input type="radio" name="theme" value="dark">
                            <span class="material-icons">dark_mode</span>
                            <span data-i18n="theme_dark"></span>
                        </label>
                    </div>
                </div>
                <div class="filter-words">
                    <div class="filter-header">
                        <label data-i18n="filter_words_label"></label>
                        <div class="filter-input-container">
                            <input type="text" id="filter-input" data-i18n-placeholder="filter_input_placeholder">
                            <button id="add-filter-btn" class="icon-button" aria-label="Ekle">
                                <span class="material-icons">add</span>
                            </button>
                        </div>
                    </div>
                    <div id="filter-tags"></div>
                </div>

                <div class="filter-words">
                    <div class="filter-header">
                        <label data-i18n="blocked_authors_label"></label>
                        <div class="filter-input-container">
                            <input type="text" id="author-filter-input" data-i18n-placeholder="author_input_placeholder">
                            <button id="add-author-filter-btn" class="icon-button" aria-label="Yazar Ekle">
                                <span class="material-icons">add</span>
                            </button>
                        </div>
                    </div>
                    <div id="author-filter-tags"></div>
                </div>

                <div class="backup-restore-group">
                    <label data-i18n="backup_restore_label"></label>
                    <div class="backup-actions">
                        <button id="export-backup-btn" class="backup-btn">
                            <span class="material-icons">download</span>
                            <span data-i18n="export_backup_btn"></span>
                        </button>
                        <button id="import-backup-btn" class="backup-btn">
                            <span class="material-icons">upload</span>
                            <span data-i18n="import_backup_btn"></span>
                        </button>
                        <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    </div>
                </div>
            </div>
            
            <div class="tab-content" data-tab="favorites">
                <div class="settings-group">
                    <label data-i18n="favorites_label"></label>
                    <div class="list-container" id="favorites-list">
                        <!-- Favoriler buraya dinamik olarak eklenecek -->
                    </div>
                </div>
            </div>
        </div>
        <div id="gundem-list"></div>
    </div>
    <div class="version">
        <span id="version-text">v1.0.0</span>
    </div>
</body>

</html>
