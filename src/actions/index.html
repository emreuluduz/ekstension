<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/material-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <script type="module" src="js/popup.js"></script>
</head>

<body>
    <div class="header">
        <h1>
            <span class="material-icons">trending_up</span>
            <span data-i18n="header_title"></span>
        </h1>
        <div class="header-actions">
            <button class="search-button" id="search-btn" title="Ara">
                <span class="material-icons">search</span>
            </button>
            <button class="coffee-button" id="coffee-btn" data-i18n-title="support_btn_title" title="Geliştiriciye Destek Ol">
                <span class="material-icons">local_cafe</span>
            </button>
            <button class="settings-button" id="settings-btn" title="Ayarlar">
                <span class="material-icons">settings</span>
            </button>
            <button class="refresh-button" id="refresh-btn" title="Yenile">
                <span class="material-icons">refresh</span>
            </button>
        </div>
    </div>
    <div class="main-tabs">
        <button class="main-tab-btn active" data-tab="gundem">
            <span class="material-icons">local_fire_department</span>
            <span data-i18n="tab_gundem"></span>
        </button>
        <button class="main-tab-btn" data-tab="debe">
            <span class="material-icons">emoji_events</span>
            <span data-i18n="tab_debe"></span>
        </button>
        <button class="main-tab-btn" data-tab="bookmarks">
            <span class="material-icons">bookmark</span>
            <span data-i18n="tab_bookmarks"></span>
        </button>
    </div>
    <div id="search-panel" class="search-panel hidden">
        <h2>Ara</h2>
        <div class="search-input-wrapper">
            <span class="material-icons search-icon">search</span>
            <input type="text" id="search-input" placeholder="Başlık veya yazar ara..." autocomplete="off">
            <span class="material-icons search-clear">close</span>
            <div class="search-loading"></div>
        </div>
        <div id="search-results-container"></div>
    </div>
    <div class="content">
        <div id="settings-panel" class="settings-panel hidden">
            <h2 data-i18n="settings_title"></h2>
            <div class="settings-tabs">
                <button class="tab-btn active" data-tab="general" data-i18n="tab_general"></button>
                <button class="tab-btn" data-tab="favorites" data-i18n="tab_favorites"></button>
            </div>
            
            <div class="tab-content active" data-tab="general">
                <div class="settings-group">
                    <label data-i18n="theme_label"></label>
                    <div class="theme-selector">
                        <label class="theme-option">
                            <input type="radio" name="theme" value="auto">
                            <span class="material-icons">brightness_auto</span>
                            <span data-i18n="theme_auto"></span>
                        </label>
                        <label class="theme-option">
                            <input type="radio" name="theme" value="light">
                            <span class="material-icons">light_mode</span>
                            <span data-i18n="theme_light"></span>
                        </label>
                        <label class="theme-option">
                            <input type="radio" name="theme" value="dark">
                            <span class="material-icons">dark_mode</span>
                            <span data-i18n="theme_dark"></span>
                        </label>
                    </div>
                </div>
                <div class="filter-words">
                    <div class="filter-header">
                        <label data-i18n="filter_words_label"></label>
                        <div class="filter-input-container">
                            <input type="text" id="filter-input" data-i18n-placeholder="filter_input_placeholder">
                            <button id="add-filter-btn" class="icon-button" aria-label="Ekle">
                                <span class="material-icons">add</span>
                            </button>
                        </div>
                    </div>
                    <div id="filter-tags"></div>
                </div>

                <div class="filter-words">
                    <div class="filter-header">
                        <label data-i18n="blocked_authors_label"></label>
                        <div class="filter-input-container">
                            <input type="text" id="author-filter-input" data-i18n-placeholder="author_input_placeholder">
                            <button id="add-author-filter-btn" class="icon-button" aria-label="Yazar Ekle">
                                <span class="material-icons">add</span>
                            </button>
                        </div>
                    </div>
                    <div id="author-filter-tags"></div>
                </div>

                <div class="ai-settings-group" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.08);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label style="font-weight: 600; display: flex; align-items: center; gap: 4px;">
                            <span class="material-icons" style="font-size: 18px; color: #7c3aed;">auto_awesome</span>
                            <span>Google Gemini AI Özetleyici</span>
                        </label>
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" style="font-size: 11px; color: #2563eb; text-decoration: none;" title="Google AI Studio'dan ücretsiz key al">🔑 Ücretsiz Key Al</a>
                    </div>
                    <p style="font-size: 11px; color: #64748b; margin: 0 0 8px 0; line-height: 1.4;">
                        Başlıkları ve uzun entry'leri Google Gemini AI ile saniyeler içinde özetlemek için Google AI Studio API anahtarınızı girin.
                    </p>
                    <div style="display: flex; gap: 6px;">
                        <input type="password" id="gemini-api-key-input" placeholder="AIzaSy..." style="flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px;" />
                        <button id="save-gemini-key-btn" class="backup-btn" style="padding: 6px 12px; background: #7c3aed; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;">
                            Kaydet
                        </button>
                    </div>
                    <div id="gemini-key-status" style="font-size: 11px; margin-top: 5px; color: #16a34a; display: none;"></div>
                </div>

                <div class="backup-restore-group">
                    <label data-i18n="backup_restore_label"></label>
                    <div class="backup-actions">
                        <button id="export-backup-btn" class="backup-btn">
                            <span class="material-icons">download</span>
                            <span data-i18n="export_backup_btn"></span>
                        </button>
                        <button id="import-backup-btn" class="backup-btn">
                            <span class="material-icons">upload</span>
                            <span data-i18n="import_backup_btn"></span>
                        </button>
                        <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    </div>
                </div>

                <div class="support-group">
                    <div class="support-header">
                        <label data-i18n="support_title"></label>
                        <p class="support-desc" data-i18n="support_desc"></p>
                    </div>
                    <div class="support-body">
                        <a href="https://buymeacoffee.com/emreuluduz" target="_blank" class="bmc-button-styled" id="bmc-link-btn" rel="noopener noreferrer">
                            <svg class="bmc-svg-icon" viewBox="0 0 768 768">
                                <path fill="#000000" d="M608.2 191.6c-4.2-12.7-14.8-21.7-28-23.8-3.4-.5-6.9-.8-10.4-.8H162.7c-3.5 0-7 .3-10.4.8-13.2 2.1-23.8 11.1-28 23.8-4.2 12.8-1.5 26.6 7.1 36.6l49.8 58.1v173.3c0 97.4 79.2 176.6 176.6 176.6h56.4c97.4 0 176.6-79.2 176.6-176.6V286.3l49.8-58.1c8.6-10 11.3-23.8 7.1-36.6zM533 459.6c0 65.5-53.3 118.8-118.8 118.8h-56.4c-65.5 0-118.8-53.3-118.8-118.8V303.4h294v156.2zm51.7-214.3H183.3l-24-28h449.4l-24 28z"/>
                            </svg>
                            <span data-i18n="buy_me_a_coffee_btn">Buy me a coffee</span>
                        </a>
                        <div class="support-qr-box" id="bmc-qr-box" title="Buy me a coffee QR">
                            <img src="../../assets/qr-code.png" alt="Buy Me A Coffee QR Code" class="support-qr-image">
                            <span class="support-qr-label">QR Kodu Tara</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" data-tab="favorites">
                <div class="settings-group">
                    <label data-i18n="favorites_label"></label>
                    <div class="list-container" id="favorites-list">
                        <!-- Favoriler buraya dinamik olarak eklenecek -->
                    </div>
                </div>
            </div>
        </div>
        <div id="bookmarks-panel" class="bookmarks-panel hidden">
            <div class="bookmarks-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h2 style="margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                    <span class="material-icons" style="font-size: 18px; color: #10b981;">bookmark</span>
                    <span>Okuma Listesi</span>
                    <span id="popup-bookmarks-count" class="badge-count" style="font-size: 11px; background: rgba(16,185,129,0.15); color: #10b981; padding: 1px 6px; border-radius: 10px;">0</span>
                </h2>
                <div class="bookmarks-actions" style="display: flex; gap: 4px;">
                    <button id="popup-export-md-btn" class="backup-btn" style="padding: 3px 6px; font-size: 11px; display: inline-flex; align-items: center; gap: 2px;" title="Markdown (.md) Olarak İndir">
                        <span class="material-icons" style="font-size: 13px;">description</span> .md
                    </button>
                    <button id="popup-export-json-btn" class="backup-btn" style="padding: 3px 6px; font-size: 11px; display: inline-flex; align-items: center; gap: 2px;" title="JSON Olarak İndir">
                        <span class="material-icons" style="font-size: 13px;">code</span> .json
                    </button>
                </div>
            </div>
            <div class="search-input-wrapper" style="margin-bottom: 10px;">
                <span class="material-icons search-icon" style="font-size: 16px;">search</span>
                <input type="text" id="popup-bookmarks-search" placeholder="Kayıtlı entry'lerde ara..." autocomplete="off" style="font-size: 12px; padding: 6px 30px 6px 30px;">
            </div>
            <div id="popup-bookmarks-list" class="popup-bookmarks-list">
                <!-- Kayıtlı entry kartları -->
            </div>
        </div>
        <div id="gundem-list"></div>
    </div>
    <div class="version">
        <span id="version-text">v1.0.0</span>
    </div>
</body>

</html>
