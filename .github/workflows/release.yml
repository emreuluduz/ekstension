name: Release & Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit directly for review? (If false, uploads as draft)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-and-publish:
    name: Test, Package & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. VERIFICATION: Version Mismatch Guard (Tag vs Manifest)
      - name: Read & Verify Manifest Version
        id: version_check
        run: |
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          echo "MANIFEST_VERSION=$MANIFEST_VER" >> $GITHUB_ENV

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [[ "$MANIFEST_VER" != "$TAG_VER" ]]; then
              echo "::error::Version mismatch! Git tag (v$TAG_VER) does not match manifest.json ($MANIFEST_VER)"
              exit 1
            fi
            echo "Manifest version matches Git tag: v$MANIFEST_VER"
          fi

      # 2. VERIFICATION: JSON Format Integrity
      - name: Validate JSON & Locale Files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('rules.json'))"
          find _locales -name "*.json" -exec node -e "JSON.parse(require('fs').readFileSync('{}'))" \;
          echo "All JSON and locale files are valid."

      # 3. VERIFICATION: JS Syntax & Unit Tests
      - name: Check JavaScript Syntax
        run: |
          find src -name "*.js" -exec node --check {} +
          echo "All JavaScript files in src/ passed syntax check."

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            node --test tests/
          else
            echo "No tests directory found, skipping unit tests."
          fi

      # 4. PACKAGING
      - name: Package Extension (ZIP)
        run: |
          ZIP_NAME="ekstension-v${{ env.MANIFEST_VERSION }}.zip"
          zip -r "$ZIP_NAME" manifest.json rules.json _locales icons src -x "*.DS_Store*"
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "Successfully packaged: $ZIP_NAME"

      # 5. UPLOAD & PUBLISH TO CHROME WEB STORE
      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          SUBMIT_FOR_REVIEW: ${{ github.event_name == 'push' || github.event.inputs.submit_for_review == true }}
        run: |
          echo "Uploading package to Chrome Web Store..."
          npx --yes chrome-webstore-upload-cli upload \
            --source="${{ env.ZIP_FILE }}" \
            --extension-id="$EXTENSION_ID" \
            --publisher-id="$PUBLISHER_ID"

          if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
            echo "Submitting uploaded version for review..."
            npx --yes chrome-webstore-upload-cli publish \
              --extension-id="$EXTENSION_ID" \
              --publisher-id="$PUBLISHER_ID"
          else
            echo "Uploaded as draft. Skipping review submission."
          fi

      # 6. GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_FILE }}
          generate_release_notes: true
          name: "ek$tension v${{ env.MANIFEST_VERSION }}"
